version: "3.9"

services:
  log-server:
    build:
      context: ./LogServer
      dockerfile: Dockerfile

    container_name: easysave-log-server

    ports:
      - "9000:9000"

    volumes:
      - ./logs-data:/logs

    environment:
      LOG_SERVER_PORT: "9000"
      LOG_DIR: "/logs"

    restart: unless-stopped
